<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <style>
    .jack { animation: jack 1s ease-in-out infinite; }
    @keyframes jack { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  </style>
  <rect x="0" y="0" width="200" height="120" fill="#0B0F1A"/>
  <g class="jack" style="transform-origin:100px 60px">
    <circle cx="100" cy="25" r="10" fill="#3DFF8F"/>
    <line x1="100" y1="35" x2="100" y2="70" stroke="#4DD9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="45" x2="70" y2="20" stroke="#4DD9FF" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="45" x2="130" y2="20" stroke="#4DD9FF" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="70" x2="75" y2="100" stroke="#4DD9FF" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="70" x2="125" y2="100" stroke="#4DD9FF" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="100" y="115" text-anchor="middle" fill="#9AA6C0" font-size="12">Jumping jacks</text>
</svg>
