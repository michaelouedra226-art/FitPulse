<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <style>
    .leg { animation: lunge 1.6s ease-in-out infinite; transform-origin: 100px 80px; }
    @keyframes lunge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(15px); } }
  </style>
  <rect x="0" y="0" width="200" height="120" fill="#0B0F1A"/>
  <g class="leg">
    <circle cx="90" cy="30" r="12" fill="#3DFF8F"/>
    <line x1="90" y1="42" x2="90" y2="70" stroke="#4DD9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="70" x2="60" y2="100" stroke="#4DD9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="70" x2="130" y2="100" stroke="#4DD9FF" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="100" y="115" text-anchor="middle" fill="#9AA6C0" font-size="12">Fentes</text>
</svg>
