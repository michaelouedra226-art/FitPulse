<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <style>
    .body { animation: push 1.6s ease-in-out infinite; transform-origin: 100px 60px; }
    @keyframes push { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
  </style>
  <rect x="0" y="0" width="200" height="120" fill="#0B0F1A"/>
  <g class="body">
    <circle cx="40" cy="40" r="12" fill="#3DFF8F"/>
    <line x1="40" y1="52" x2="160" y2="52" stroke="#4DD9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="40" y1="52" x2="40" y2="90" stroke="#4DD9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="160" y1="52" x2="160" y2="90" stroke="#4DD9FF" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="100" y="110" text-anchor="middle" fill="#9AA6C0" font-size="12">Pompes</text>
</svg>
