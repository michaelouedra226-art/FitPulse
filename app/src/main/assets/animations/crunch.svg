<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <style>
    .crunch { animation: crunch 1.4s ease-in-out infinite; transform-origin: 100px 90px; }
    @keyframes crunch { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-12deg); } }
  </style>
  <rect x="0" y="0" width="200" height="120" fill="#0B0F1A"/>
  <g class="crunch">
    <circle cx="60" cy="80" r="10" fill="#3DFF8F"/>
    <line x1="60" y1="90" x2="140" y2="90" stroke="#4DD9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="140" y1="90" x2="140" y2="60" stroke="#4DD9FF" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="100" y="115" text-anchor="middle" fill="#9AA6C0" font-size="12">Crunchs</text>
</svg>
