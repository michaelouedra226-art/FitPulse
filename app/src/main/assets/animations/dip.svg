<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <style>
    .dip { animation: dip 1.5s ease-in-out infinite; transform-origin: 100px 60px; }
    @keyframes dip { 0%,100% { transform: translateY(0); } 50% { transform: translateY(15px); } }
  </style>
  <rect x="0" y="0" width="200" height="120" fill="#0B0F1A"/>
  <rect x="30" y="95" width="140" height="8" rx="4" fill="#9B7BFF"/>
  <g class="dip">
    <circle cx="100" cy="40" r="10" fill="#3DFF8F"/>
    <line x1="100" y1="50" x2="100" y2="75" stroke="#4DD9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="75" x2="75" y2="95" stroke="#4DD9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="75" x2="125" y2="95" stroke="#4DD9FF" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="100" y="115" text-anchor="middle" fill="#9AA6C0" font-size="12">Dips chaise</text>
</svg>
